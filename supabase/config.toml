[functions.apps-script-pull]
verify_jwt = false

[functions.scanner-access]
verify_jwt = false

[functions.check-in]
verify_jwt = false

[functions.ticket-lookup]
verify_jwt = false

[functions.online-order-submit]
verify_jwt = false
